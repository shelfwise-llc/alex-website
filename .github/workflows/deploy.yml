name: Build, Test, and Deploy

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alex/alex_website

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.14'  # Match your mix.exs version
          otp-version: '25'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run quality checks
        run: mix quality.ci
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  build-and-deploy:
    name: Build and Deploy
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Determine environment based on branch
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ENVIRONMENT="production"
            else
              ENVIRONMENT="staging"
            fi
            
            # Create project directory if it doesn't exist
            mkdir -p /home/${{ secrets.VPS_USER }}/personal/alex_website
            cd /home/${{ secrets.VPS_USER }}/personal/alex_website
            
            # Pull the latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            # Create or update docker-compose file
            cat > docker-compose.$ENVIRONMENT.yml << EOF
            version: '3.8'
            
            services:
              traefik:
                image: traefik:v2.10
                container_name: traefik
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock:ro
                  - ./traefik:/etc/traefik
                command:
                  - "--api.insecure=true"
                  - "--providers.docker=true"
                  - "--providers.docker.exposedbydefault=false"
                  - "--entrypoints.web.address=:80"
                  - "--entrypoints.websecure.address=:443"
                  - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
                  - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
                  - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
                  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
                  - "--certificatesresolvers.letsencrypt.acme.email=\${EMAIL}"
                  - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
            
              db:
                image: postgres:16
                environment:
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                  POSTGRES_USER: \${POSTGRES_USER}
                  POSTGRES_DB: alex_website_\${ENVIRONMENT}
                volumes:
                  - postgres_\${ENVIRONMENT}_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
            
              ghost:
                image: ghost:5-alpine
                restart: always
                environment:
                  database__client: mysql
                  database__connection__host: ghost_db
                  database__connection__user: root
                  database__connection__password: \${GHOST_DB_PASSWORD}
                  database__connection__database: ghost_\${ENVIRONMENT}
                  url: \${GHOST_URL}
                  NODE_ENV: \${ENVIRONMENT}
                volumes:
                  - ghost_\${ENVIRONMENT}_content:/var/lib/ghost/content
                depends_on:
                  ghost_db:
                    condition: service_healthy
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.ghost-\${ENVIRONMENT}.rule=Host(\`\${GHOST_HOST}\`)"
                  - "traefik.http.routers.ghost-\${ENVIRONMENT}.tls=true"
                  - "traefik.http.routers.ghost-\${ENVIRONMENT}.tls.certresolver=letsencrypt"
                  - "traefik.http.services.ghost-\${ENVIRONMENT}.loadbalancer.server.port=2368"
            
              ghost_db:
                image: mysql:8.0
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: \${GHOST_DB_PASSWORD}
                  MYSQL_DATABASE: ghost_\${ENVIRONMENT}
                volumes:
                  - ghost_\${ENVIRONMENT}_db_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  timeout: 20s
                  retries: 10
            
              phoenix:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
                restart: unless-stopped
                environment:
                  MIX_ENV: \${ENVIRONMENT}
                  DATABASE_URL: "ecto://\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@db/alex_website_\${ENVIRONMENT}"
                  SECRET_KEY_BASE: \${SECRET_KEY_BASE}
                  PHX_HOST: \${PHX_HOST}
                  PORT: 4000
                  GHOST_CONTENT_API_KEY: \${GHOST_CONTENT_API_KEY}
                depends_on:
                  db:
                    condition: service_healthy
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.alex-website-\${ENVIRONMENT}.rule=Host(\`\${PHX_HOST}\`)"
                  - "traefik.http.routers.alex-website-\${ENVIRONMENT}.tls=true"
                  - "traefik.http.routers.alex-website-\${ENVIRONMENT}.tls.certresolver=letsencrypt"
                  - "traefik.http.services.alex-website-\${ENVIRONMENT}.loadbalancer.server.port=4000"
            
            volumes:
              postgres_\${ENVIRONMENT}_data:
              ghost_\${ENVIRONMENT}_content:
              ghost_\${ENVIRONMENT}_db_data:
            EOF
            
            # Setup Traefik if needed
            mkdir -p traefik
            if [ ! -f traefik/acme.json ]; then
              touch traefik/acme.json
              chmod 600 traefik/acme.json
            fi
            
            # Load environment variables
            source .env.\${ENVIRONMENT}
            
            # Deploy with docker-compose
            docker-compose -f docker-compose.\${ENVIRONMENT}.yml up -d
            
            echo "🎉 Deployment completed successfully!"



